<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebP Converter Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
    <div class="background-animation"></div>
    <div class="app-container glass-panel">
        <header>
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 16L8.586 11.414C8.96106 11.0391 9.46967 10.8284 10 10.8284C10.5303 10.8284 11.0389 11.0391 11.414 11.414L16 16M14 14L15.586 12.414C15.9611 12.0391 16.4697 11.8284 17 11.8284C17.5303 11.8284 18.0389 12.0391 18.414 12.414L20 14M14 8H14.01M6 20H18C18.5304 20 19.0391 19.7893 19.4142 19.4142C19.7893 19.0391 20 18.5304 20 18V6C20 5.46957 19.7893 4.96086 19.4142 4.58579C19.0391 4.21071 18.5304 4 18 4H6C5.46957 4 4.96086 4.21071 4.58579 4.58579C4.21071 4.96086 4 5.46957 4 6V18C4 18.5304 4.21071 19.0391 4.58579 19.4142C4.96086 19.7893 5.46957 20 6 20Z" stroke="url(#paint0_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs>
                        <linearGradient id="paint0_linear" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#FF512F"/>
                            <stop offset="1" stop-color="#DD2476"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1>WebP Converter</h1>
            </div>
        </header>

        <main>
            <section class="upload-section" id="drop-zone">
                <div class="upload-content">
                    <svg class="upload-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <p class="upload-text">Drag & drop media files here or <span>browse</span></p>
                    <p class="upload-hint">Supports GIF, PNG, JPG, MP4, MOV, AVI, WEBM</p>
                    <input type="file" id="file-input" multiple accept=".gif,.png,.jpg,.jpeg,.bmp,.tif,.tiff,.mp4,.mov,.avi,.mkv,.webm" hidden>
                </div>
            </section>

            <div class="controls-row">
                <div class="control-group">
                    <label for="quality-select">Conversion Quality</label>
                    <div class="select-wrapper">
                        <select id="quality-select">
                            <option value="q80">High Quality (q80)</option>
                            <option value="q90">Ultra Quality (q90)</option>
                            <option value="lossless">Lossless</option>
                        </select>
                    </div>
                </div>

                <div class="control-group output-group">
                    <label for="output-folder">Output Folder</label>
                    <div class="input-wrapper">
                        <input type="text" id="output-folder" value="./converted" readonly>
                        <button class="btn-secondary" id="browse-output-btn">Change</button>
                    </div>
                </div>
            </div>

            <section class="files-section">
                <div class="section-header">
                    <h3>Selected Files (<span id="file-count">0</span>)</h3>
                    <button class="btn-text" id="clear-files-btn" style="display:none;">Clear all</button>
                </div>
                <div class="file-list" id="file-list">
                    <div class="empty-state">No files selected</div>
                </div>
            </section>

            <div class="action-section">
                <button class="btn-primary" id="convert-btn" disabled>
                    <span class="btn-text-content">Start Conversion</span>
                    <svg class="spinner" viewBox="0 0 50 50" style="display:none;"><circle cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle></svg>
                </button>
            </div>

            <section class="progress-section" id="progress-section" style="display:none;">
                <div class="progress-header">
                    <span id="status-label">Converting...</span>
                    <span id="progress-percentage">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
                <div class="log-container" id="log-container">
                    <!-- Logs go here -->
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
